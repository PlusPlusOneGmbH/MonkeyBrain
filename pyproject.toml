[project]
name = "monkeybrain"
version = "0.4.0"
description = "A CLI-Tool for launching TouchDesigner projects."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [ "python-dotenv>=1.1.1", "pywin32>=311", "toml>=0.10.2",]
keywords = [ "TouchDesigner", "UV", "WindowsOnly",]
[[project.authors]]
name = "Wieland Hilker"
email = "Wieland@PlusPlus.One"

[build-system]
requires = [ "setuptools>=61.0",]
build-backend = "setuptools.build_meta"

[project.urls]
Website = "https://plusplus.one"
Repository = "https://github.com/PlusPlusOneGmbH/Monkeybrain"

[project.scripts]
mb = "monkeybrain:entry"

[tool.monkeybrain]
touchdesigner-version = "2025.32260"
projectfile = "monkeybrain.toe"
enforce-version = "closest-build"

[tool.touchdesigner.TDPyEnvManagerContext]
contextVersion = 2
createdByVersion = "1.4.0"
active = true
mode = "Python vEnv"
envName = ".venv"
installPath = "."
pythonVersion = "3.11"
autoSetup = false
autoSetupReqs = []
autoSetupSyncReqs = false
extraPaths = ["src"]


[tool.hatch.build.targets.wheel]
packages = [ "src/monkeybrain",]
artifacts = [ "*.py", "*.toe",]


